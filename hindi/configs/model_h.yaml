# Model H (Hindi) Configuration - CPU Optimized
model:
  vocab_size: 30980
  d_model: 384
  n_layers: 6
  n_heads: 6
  d_ff: 1536
  context_length: 256
  dropout: 0.1
  weight_tying: true

training:
  batch_size: 8
  learning_rate: 3e-4
  weight_decay: 0.1
  warmup_steps: 5000
  max_steps: 50000
  gradient_accumulation_steps: 4
  gradient_clip: 1.0
  mixed_precision: false

data:
  train_file: "hindi/data/train.jsonl"
  val_file: "hindi/data/val.jsonl"
  test_file: "hindi/data/test.jsonl"
  tokenizer_path: "hindi/tokenizer/artifacts/bpe_hi_32000.pkl"
  text_field: "text"
  num_workers: 0

checkpoint:
  save_dir: "hindi/checkpoints"
  save_every: 1000
  keep_last_n: 3
  hf_repo_id: "bropal/lma-project-checkpoints"

eval:
  eval_every: 1000
  eval_steps: 20
  generation_temperatures: [0.5, 1.0, 1.5]
  max_new_tokens: 50
  generation_top_k: 40
  generation_top_p: 0.9
  generation_repetition_penalty: 1.2

logging:
  log_dir: "phase2/logs"
  log_every: 100
  wandb: false

seed: 42