[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lma"
version = "0.1.0"
description = "Monolingual Transformer LMs in Hindi and Nepali (LMA Project)"
requires-python = ">=3.9"
dependencies = [
    "aiohttp",
    "beautifulsoup4",
    "datasketch",
    "ebooklib",
    "feedparser",
    "lxml",
    "pdfplumber",
    "pillow",
    "numpy",
    "pypdf",
    "pytest",
    "pyyaml",
    "readability-lxml",
    "requests",
    "trafilatura",
    "tqdm>=4.70.0",
    "matplotlib>=3.9.4",
    "huggingface-hub>=1.8.0",
    "datasets>=4.5.0",
    "pyarrow>=21.0.0",
    "tensorboard>=2.21.0",
    "torch>=2.8.0",
    "sacrebleu>=2.6.0",
    "rouge-score>=0.1.2",
]

[project.scripts]
crawler = "crawler.cli:main"
clean-hindi = "scripts.clean_hindi:main"
report-stats = "scripts.generate_report_stats:main"
tokenizer = "tokenizer.cli:main"

# Hindi LM training / evaluation / generation CLI scripts
lma-train-hindi = "hindi.train.training:main"
lma-eval-hindi = "hindi.eval.evaluation:main"
lma-generate = "hindi.eval.evaluation:generate_samples"
lma-tokenize = "tokenizer.cli:main"

# Nepali LM training / evaluation / generation CLI scripts
lma-train-nepali = "nepali.train.training:main"
lma-eval-nepali = "nepali.eval.evaluation:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["crawler", "crawler.extractors", "tokenizer", "scripts", "hindi", "nepali"]
